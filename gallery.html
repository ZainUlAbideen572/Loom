<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./gallery.css">
    <title>Document</title>
</head>
<body>
    <div class="back">BACK</div>
    <div id="cont" class="gallery-cont"></div>

    <script src="./db.js" defer></script>
    <script src="./gallery.js" defer></script>
    <script defer>
        

        let backElem = document.querySelector(".back");
        let ele=document.getElementById('cont')
       
        function back(ele) {
                console.log('clicked');
                console.log(ele.childNodes.length)
                if (ele.childNodes.length === 0) {
                    setTimeout(() => {
                        location.assign('./index.html');
                    }, 1000);
                }
            }


        backElem.addEventListener("click", (e) => {
            location.assign("./index.html");

        })
        const observer=new MutationObserver(()=>{
            back(ele)
        })

        observer.observe(ele,{childList:true})
        // MutationObserver helps ust to observe the changes in the DOM 
        // create the instance of observer then call observe method on it.
        // the second argument is the options object which contains the type of changes we want to observe.
        // Options are according to the config itself we cant define childNodes because it is not a property which defines the type of change.
    </script>
</body>
</html>
